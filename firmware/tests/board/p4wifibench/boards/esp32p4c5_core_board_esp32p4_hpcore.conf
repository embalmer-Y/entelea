# SPDX-License-Identifier: Apache-2.0
# C5 scan diagnostic only; no credentials, provisioning or persistent writes.
CONFIG_P4W_SCAN_ONLY=y
CONFIG_TS_CORE=y
CONFIG_TS_SAFETY=y
CONFIG_TS_WDT_REQUIRE_HW=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000
CONFIG_TASK_WDT_HW_FALLBACK_PAUSE_HALTED_BY_DBG=n
CONFIG_TS_STORE=n
CONFIG_TS_HAL=n
CONFIG_TS_APPMGR=n
CONFIG_TS_APP_WAMR=n
CONFIG_TS_NET=n
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_DBG=n
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_INF=y
CONFIG_WIFI_LOG_LEVEL_DBG=y
# Direct UART logging retains early companion init evidence; no shell log queue.
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_LOG_BACKEND_UART=y
