# SPDX-License-Identifier: Apache-2.0
# TLS-capable network diagnostic; credentials arrive over UART, not Kconfig.
CONFIG_P4W_SCAN_ONLY=n
CONFIG_P4W_NETWORK_ONLY=y
CONFIG_WIFI_LOG_LEVEL_DBG=n
CONFIG_WIFI_LOG_LEVEL_INF=y
CONFIG_WIFI_STA_AUTO_DHCPV4=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_TCP=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_RUNTIME_STATS=n
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
CONFIG_P4W_NETWORK_TLS=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_CACHE=n
CONFIG_NET_SOCKETS_DNS_TIMEOUT=3000
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=5000
CONFIG_NET_SOCKETS_TLS_CERT_VERIFY_CALLBACK=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
