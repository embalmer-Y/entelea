# Extra configuration for the pinned upstream samples/hello_world application.
# The ESP32 UART driver requires GPIO support for the serial console.
CONFIG_GPIO=y
CONFIG_I2C=n
CONFIG_I2S=n
CONFIG_SPI=n
CONFIG_SDHC=n
CONFIG_DISK_ACCESS=n
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_BT=n
CONFIG_DMA=n
CONFIG_DISPLAY=n
CONFIG_INPUT=n
CONFIG_VIDEO=n
CONFIG_SENSOR=n
