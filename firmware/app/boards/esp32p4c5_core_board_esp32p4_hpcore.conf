# Bring-up uses RAM-backed, small-tier App slots, not persistent product storage.
# Two default 256 KiB slots plus the WAMR pool exceed internal P4 SRAM.
# Keep runtime/safety data internal until PSRAM and flash pass board validation.
CONFIG_TS_STORE_SLOT_SIZE=32768
CONFIG_TS_APP_THREAD_STACK=16384

# Hardware fallback is required on P4; physical reset timing is verified at H0.
CONFIG_TS_WDT_REQUIRE_HW=y
CONFIG_TASK_WDT_MIN_TIMEOUT=5000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=5000
CONFIG_TASK_WDT_HW_FALLBACK_PAUSE_HALTED_BY_DBG=n
