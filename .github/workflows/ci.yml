name: Entelea
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked && uv sync --project agent --locked --extra dev
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: make check
      - run: make agent-test
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: sudo apt-get update && sudo apt-get install -y ninja-build gperf device-tree-compiler
      - run: bash scripts/setup-firmware.sh
      - name: Changed C kernel style
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=import-baseline; fi
          make style BASE="$BASE"
      - run: make firmware-build firmware-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-test-results
          path: build/twister/twister.*
