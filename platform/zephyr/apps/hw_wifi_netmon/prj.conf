# F-1 真网闸（WiFi 关联+netmon 依赖联动）。网络栈/栈尺寸纪律=旧树
# p4wifibench E1 实测底（RX/sysworkq ≥4096；RV32 帧深 main 8192——
# 亦 D 批 verify 深栈同因）。
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
# 旧树 E1 实测纪律：事件带 info（wifi_status 才可见）；大堆（SDIO/
# nanopb 分配面——4KB 默认实测不足）；WiFi DBG（枚举诊断面）。
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
# esp_hosted select 序消歧（select 时 NANOPB 尚未 y → Kconfig 警告
# 中止；显式预置后 select 无新约束——Zephyr 4.5 已知模式）。
CONFIG_NANOPB=y
CONFIG_NANOPB_ENABLE_MALLOC=y
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_INF=y
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_TEST_RANDOM_GENERATOR=n
# flash 存储后端（boot storage_init 步骤挂 flash_store 强实现）。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# SRAM 预算（sram0_0_seg 溢出 64KB 实测后裁剪）：网络包缓冲减配。
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
# 看门狗闸测参数（§10.2-C3 已追认）
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_HWINFO=y
# C5 从复位到 SDIO armed 的冷启动裕量（驱动枚举窗 2s 硬编码——
# 先加大复位脉冲确保 C5 真正重启；不足则上 pinned patch 扩窗）。
CONFIG_ESP_HOSTED_MCU_RESET_PULSE_MS=500
