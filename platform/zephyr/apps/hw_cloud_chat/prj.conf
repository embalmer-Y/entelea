# r15 MCU 真云闸（A-1）：hw_wifi_netmon 基座（WiFi/DHCP/netmon/栈纪律）
# + mbedtls TLS 客户端 + DNS 解析 + POSIX socket 面。
# TLS 内存预算（板 768KB SRAM 实测基线）：MBEDTLS heap 32KB（TLS1.3
# ECDHE 会话+证书链）；in/out 4096（证书帧）；网络 buf 适度上调（TLS
# 记录 16KB 级分片重配）——实测随批记入 board 资源表。
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_ESP_HOSTED_MCU_LOG_LEVEL_INF=y
CONFIG_WIFI=y
# esp_hosted select 序消歧（select 时 NANOPB 尚未 y → Kconfig 警告中止；
# 显式预置后 select 无新约束——Zephyr 4.5 已知模式，同 hw_wifi_netmon）。
CONFIG_NANOPB=y
CONFIG_NANOPB_ENABLE_MALLOC=y
CONFIG_WIFI_ESP_HOSTED_MCU=y
CONFIG_NET_RX_STACK_SIZE=4096
# r15 根因（HW 栈保护实证）：tcp_work 线程默认栈在 TLS 记录重组
# （4KB in_buf 分片）路径下溢出=FATAL 2 Stack overflow。
CONFIG_NET_TCP_WORKQ_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_TEST_RANDOM_GENERATOR=n
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# TLS 记录分片预算（netmon 基座 4/8 上调：证书链 4KB 帧）
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_HWINFO=y
CONFIG_ESP_HOSTED_MCU_RESET_PULSE_MS=500
# r15 根因定案：RX/event 线程 RPC 帧栈上解码（Kconfig 自述 must
# accommodate the largest frame），4096 默认在 TLS 大流量聚合帧下
# 溢出=CPU exception（mepc 落数据区/ra 垃圾/崩点恒 rx_stack 区，
# 三轮真机实证）。SDIO 聚合上限 4092+RPC 头 → 16384。
CONFIG_ESP_HOSTED_MCU_EVENT_TASK_STACK_SIZE=16384
# ---- r15 追加：DNS + POSIX + mbedtls 裸 API 客户端 ----
CONFIG_DNS_RESOLVER=y
CONFIG_POSIX_API=y
CONFIG_MBEDTLS=y
# 依赖链（4.x PSA 面）：PSA_CRYPTO → provider MBEDTLS（select
# MBEDTLS_PSA_CRYPTO_C）→ MBEDTLS_BUILTIN（模块源编译）。
CONFIG_PSA_CRYPTO=y
# PSA 能力发现一把梭（sig algs/ECDH 组由 WANT 枚举——TLS1.3 hello 的
# signature_algorithms 空缺会致服务器 handshake_failure(alert 40)，
# r15 真机实证；按需收窄归后续优化批+内存表记录）。
CONFIG_PSA_CRYPTO_ENABLE_ALL=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
# 4.x 模块符号面（Zephyr modules/mbedtls/Kconfig.mbedtls——无 MBEDTLS_SSL
# /KEY_EXCHANGE_ALL/X509 聚合符号；TLS1.3+X509 CRT+RSA/ECDHE 逐项开）。
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS1_3_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_DEBUG=y
# r15 实证根因：TLS1.3 预设签名表 PSS 项条件=X509_RSASSA_PSS_SUPPORT
# （RSA 证书 CDN 必须收到 rsa_pss_rsae offer——pkcs1-only 复现 alert 40）。
CONFIG_MBEDTLS_X509_RSASSA_PSS_SUPPORT=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
# 板上运行时内存观测（r15 内存实测表数据源）
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
