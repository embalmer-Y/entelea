# R02 D12 硬件闸镜像配置（建议值，待 owner 追认——记录于 r02-validation）：
# 后台通道 3s（task_wdt 监视器周期喂 MWDT）/ 业务通道 5s（巡检喂，到期
# sys_reboot）/ 硬件窗 3+2s（MWDT0 RESET_SOC 兜底）。hwinfo 用于相位判别。
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_HWINFO=y
