# R02 最小监督镜像：默认内核面即可（软 WDT 巡检走 sysworkq）。
# CONFIG_TASK_WDT 由板级装配按参考板冻结时再启用（D12）。
CONFIG_HWINFO=y
# r16 板级：flash 后端（D12 红线断言逼出——RAM 镜像数组 655KB 超 540KB
# 红线；板级一律 flash_store+NO_RAM_BACKEND，同 hw_wifi_netmon 纪律）。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# r16：WDT 硬件兜底（D12 批准后 minimal 常驻面标配——storm 变体的
# 异常复位源即此：system_fail 停喂→MWDT 复位；soak 判据同面）。
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_RETAINED_MEM=y
