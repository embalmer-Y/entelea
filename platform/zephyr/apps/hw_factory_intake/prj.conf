# D-3 工厂闭环闸（native_sim 变体的 flash 面经 EXTRA_CONF_FILE 叠加）。
CONFIG_TEST_RANDOM_GENERATOR=y
# 板级：flash 存储后端（同 hw_flash_persist 纪律）+ 看门狗闸测参数
# （§10.2-C3 已追认三元组）。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
# 验签深栈（pkg_verify raw[512]+tweetnacl ed25519 open——板级实测
# Illegal instruction=main 栈溢出 PC 落 z_main_stack）。
CONFIG_MAIN_STACK_SIZE=8192
