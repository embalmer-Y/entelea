# R03 板级批 A-3：flash 持久化闸镜像（复用 R02 闸测超时三元组——
# 计划 §10.2-C3 已追认：MIN=3000/FALLBACK=2000/通道=5000ms）。
CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_HWINFO=y
# flash 存储后端（boot 弱桩被 flash_store.c 强实现接管）。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
