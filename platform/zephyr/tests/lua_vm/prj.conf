CONFIG_ZTEST=y
# Lua's parser and C-level nesting run on the calling thread's C stack, and
# the harness measures that use in a window of half this size. With the
# stock nesting limit that use reaches about 300 KB on a board: a board run
# has to raise this (see docs/lua-feasibility.md); the simulator, whose
# threads run on host stacks, does not.
CONFIG_ZTEST_STACK_SIZE=65536
# The interpreter's heap is 320 KB. The simulator selects the small sys_heap
# implementation by default, which cannot hold more than about 128 KB on a
# 32-bit target and halts at boot when asked to; a board already selects the
# automatic choice.
CONFIG_SYS_HEAP_AUTO=y
# Firmware-like code size (-Os) so the footprint numbers are representative.
CONFIG_SIZE_OPTIMIZATIONS=y
