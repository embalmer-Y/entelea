# SPDX-License-Identifier: Apache-2.0
CONFIG_ZTEST=y
# Lua's parser and C-level nesting run on the calling thread's C stack, and
# the harness measures that use in a window of half this size.
CONFIG_ZTEST_STACK_SIZE=65536
# Kernel heap for the libc allocator on targets whose malloc is Zephyr's
# (on native_sim realloc resolves to the host). Kept below the limit of the
# small-heap implementation this configuration selects.
CONFIG_HEAP_MEM_POOL_SIZE=98304
# Firmware-like code size (-Os) so the footprint numbers are representative.
CONFIG_SIZE_OPTIMIZATIONS=y
