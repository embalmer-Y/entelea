[project]
name = "entelea-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "west==1.5.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "clang-format==18.1.8",
    "pyelftools==0.33",
    "PyYAML==6.0.3",
    "pykwalify==1.8.0",
    "packaging==26.3",
    "jsonschema",
    "pyserial",
    "psutil",
    "colorama",
    "ply",
    "junitparser",
    "python-dotenv",
    "natsort",
    "tabulate",
    "anytree",
]

[dependency-groups]
p4 = ["esptool==5.3.0"]
p4-net = [{include-group = "p4"}, "protobuf>=3.20"]
p4-tls = [{include-group = "p4-net"}]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
